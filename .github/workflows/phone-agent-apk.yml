name: Build Phone Agent APK

on:
  push:
    paths:
      - "android-agent/**"
      - ".github/workflows/phone-agent-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhoneAgent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-apk
          path: android-agent/PhoneAgent.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-agent-build-${{ github.run_number }}
          name: Phone Agent (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: android-agent/PhoneAgent.apk
