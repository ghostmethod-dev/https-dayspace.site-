name: Build HTML Runner APK

on:
  push:
    paths:
      - "html-runner/**"
      - ".github/workflows/html-runner-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: html-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HtmlRunner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HtmlRunner-apk
          path: html-runner/HtmlRunner.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: html-runner-build-${{ github.run_number }}
          name: HTML Runner (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: html-runner/HtmlRunner.apk
